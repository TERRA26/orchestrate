<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Pinball</title>
    <style>
      /* ---------- Reset & Base ---------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #0a0a12;
        color: #e0e0ff;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      /* ---------- Layout ---------- */
      #game-wrapper {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      /* ---------- HUD ---------- */
      #hud {
        display: flex;
        justify-content: space-between;
        width: 480px;
        padding: 8px 20px;
        background: linear-gradient(135deg, #12122a 0%, #1a1a3a 100%);
        border: 1px solid rgba(120, 80, 255, 0.4);
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(120, 80, 255, 0.15);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      #hud .label {
        color: #888aaa;
        font-size: 11px;
        display: block;
      }
      #hud .value {
        color: #ff44cc;
        text-shadow: 0 0 8px #ff44cc88;
      }
      #hud .lives .value {
        color: #44ffaa;
        text-shadow: 0 0 8px #44ffaa88;
      }

      /* ---------- Canvas ---------- */
      #pinball-canvas {
        border: 2px solid rgba(120, 80, 255, 0.5);
        border-radius: 16px;
        box-shadow:
          0 0 30px rgba(120, 80, 255, 0.2),
          inset 0 0 60px rgba(0, 0, 0, 0.5);
        cursor: default;
      }

      /* ---------- Overlays ---------- */
      .overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .overlay h1 {
        font-size: 48px;
        margin-bottom: 12px;
        text-shadow:
          0 0 20px #ff44cc,
          0 0 40px #ff44cc66;
        color: #ff44cc;
      }
      .overlay h2 {
        font-size: 28px;
        margin-bottom: 8px;
        color: #44ffaa;
        text-shadow: 0 0 12px #44ffaa88;
      }
      .overlay p {
        font-size: 16px;
        margin-bottom: 24px;
        color: #aaaacc;
      }
      .overlay button {
        padding: 14px 40px;
        font-size: 18px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        border: 2px solid #ff44cc;
        border-radius: 8px;
        background: transparent;
        color: #ff44cc;
        cursor: pointer;
        transition: all 0.2s;
        text-shadow: 0 0 8px #ff44cc88;
        box-shadow: 0 0 15px rgba(255, 68, 204, 0.3);
      }
      .overlay button:hover {
        background: #ff44cc;
        color: #0a0a12;
        text-shadow: none;
        box-shadow: 0 0 30px rgba(255, 68, 204, 0.6);
      }

      /* ---------- Instructions ---------- */
      #instructions {
        width: 480px;
        text-align: center;
        font-size: 12px;
        color: #666688;
        letter-spacing: 0.5px;
      }
      #instructions kbd {
        display: inline-block;
        padding: 2px 7px;
        background: #1a1a2e;
        border: 1px solid #333355;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        color: #9999bb;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="hud">
        <div class="score">
          <span class="label">Score</span><span class="value" id="hud-score">0</span>
        </div>
        <div class="lives">
          <span class="label">Balls</span><span class="value" id="hud-lives">3</span>
        </div>
        <div class="bonus">
          <span class="label">Multiplier</span><span class="value" id="hud-multi">×1</span>
        </div>
      </div>

      <canvas id="pinball-canvas" width="480" height="720"></canvas>

      <!-- Start Screen -->
      <div class="overlay visible" id="start-screen">
        <h1>Neon Pinball</h1>
        <p>Use flippers to keep the ball alive.<br />Hit bumpers to score big!</p>
        <button id="btn-start">Start Game</button>
      </div>

      <!-- Game Over Screen -->
      <div class="overlay" id="gameover-screen">
        <h1>Game Over</h1>
        <h2 id="final-score">Score: 0</h2>
        <p id="high-score-msg"></p>
        <button id="btn-restart">Play Again</button>
      </div>

      <div id="instructions">
        <kbd>←</kbd> / <kbd>A</kbd> Left flipper &nbsp;&nbsp; <kbd>→</kbd> / <kbd>D</kbd> Right
        flipper &nbsp;&nbsp; <kbd>Space</kbd> / <kbd>↓</kbd> Launch ball
      </div>
    </div>

    <script>
      // ===================================================================
      // NEON PINBALL – Full Canvas Game
      // ===================================================================

      (() => {
        "use strict";

        // ---------- Constants ----------
        const CANVAS_W = 480;
        const CANVAS_H = 720;
        const GRAVITY = 0.25;
        const BALL_RADIUS = 8;
        const FRICTION = 0.998;
        const WALL_BOUNCE = 0.6;
        const FLIPPER_BOUNCE = 1.15;
        const BUMPER_BOUNCE = 1.4;
        const MAX_LIVES = 3;
        const PLUNGER_X = CANVAS_W - 30;
        const PLUNGER_LANE_LEFT = CANVAS_W - 50;
        const GUTTER_Y = CANVAS_H - 20;

        // ---------- DOM ----------
        const canvas = document.getElementById("pinball-canvas");
        const ctx = canvas.getContext("2d");
        const hudScore = document.getElementById("hud-score");
        const hudLives = document.getElementById("hud-lives");
        const hudMulti = document.getElementById("hud-multi");
        const startScreen = document.getElementById("start-screen");
        const gameoverScreen = document.getElementById("gameover-screen");
        const finalScoreEl = document.getElementById("final-score");
        const highScoreMsg = document.getElementById("high-score-msg");

        // ---------- State ----------
        let score = 0;
        let lives = MAX_LIVES;
        let multiplier = 1;
        let gameRunning = false;
        let ballInPlay = false;
        let highScore = parseInt(localStorage.getItem("pinball-hi") || "0", 10);

        // Plunger
        let plungerHeld = false;
        let plungerPower = 0;
        const PLUNGER_MAX = 18;
        const PLUNGER_CHARGE_RATE = 0.35;

        // Ball
        let ball = { x: PLUNGER_X, y: CANVAS_H - 80, vx: 0, vy: 0 };

        // Keys
        const keys = {};

        // ---------- Flippers ----------
        const FLIPPER_LENGTH = 60;
        const FLIPPER_THICKNESS = 10;
        const FLIPPER_REST_ANGLE = 0.45; // radians from horizontal
        const FLIPPER_ACTIVE_ANGLE = -0.55;
        const FLIPPER_SPEED = 0.22;

        const flippers = [
          {
            // Left flipper
            pivotX: 130,
            pivotY: 640,
            side: "left",
            angle: FLIPPER_REST_ANGLE,
            targetAngle: FLIPPER_REST_ANGLE,
          },
          {
            // Right flipper
            pivotX: 350,
            pivotY: 640,
            side: "right",
            angle: -FLIPPER_REST_ANGLE,
            targetAngle: -FLIPPER_REST_ANGLE,
          },
        ];

        // ---------- Bumpers ----------
        const bumpers = [
          { x: 160, y: 220, r: 28, points: 100, glow: 0, color: "#ff44cc" },
          { x: 300, y: 180, r: 28, points: 100, glow: 0, color: "#44ccff" },
          { x: 230, y: 310, r: 28, points: 150, glow: 0, color: "#ffaa22" },
          { x: 120, y: 400, r: 22, points: 200, glow: 0, color: "#44ffaa" },
          { x: 340, y: 380, r: 22, points: 200, glow: 0, color: "#ff4466" },
          { x: 230, y: 480, r: 20, points: 250, glow: 0, color: "#aa66ff" },
        ];

        // ---------- Walls / Guides ----------
        // Each wall is a line segment {x1,y1,x2,y2}
        const walls = [
          // Left boundary
          { x1: 20, y1: 0, x2: 20, y2: 600 },
          // Right boundary (above plunger lane)
          { x1: 460, y1: 0, x2: 460, y2: 120 },
          // Plunger lane left wall
          { x1: PLUNGER_LANE_LEFT, y1: 120, x2: PLUNGER_LANE_LEFT, y2: CANVAS_H },
          // Plunger lane right wall
          { x1: 460, y1: 120, x2: 460, y2: CANVAS_H },
          // Top wall
          { x1: 20, y1: 20, x2: 460, y2: 20 },
          // Left gutter guide (angled)
          { x1: 20, y1: 600, x2: 80, y2: 660 },
          // Right gutter guide (angled)
          { x1: PLUNGER_LANE_LEFT, y1: 600, x2: 400, y2: 660 },
          // Top-left curve guide
          { x1: 20, y1: 20, x2: 60, y2: 60 },
          // Top-right curve guide
          { x1: 460, y1: 20, x2: 420, y2: 60 },
          // Left inner guide
          { x1: 60, y1: 200, x2: 50, y2: 320 },
          // Right inner guide
          { x1: 400, y1: 200, x2: 410, y2: 320 },
        ];

        // ---------- Slingshots (triangular kickers) ----------
        const slingshots = [
          { x1: 80, y1: 520, x2: 80, y2: 600, x3: 130, y3: 600, color: "#ff44cc", glow: 0 },
          {
            x1: PLUNGER_LANE_LEFT - 80,
            y1: 520,
            x2: PLUNGER_LANE_LEFT - 80,
            y2: 600,
            x3: PLUNGER_LANE_LEFT - 130,
            y3: 600,
            color: "#44ccff",
            glow: 0,
          },
        ];

        // ---------- Particles ----------
        let particles = [];

        function spawnParticles(x, y, color, count = 8) {
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;
            particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              life: 1,
              decay: 0.02 + Math.random() * 0.03,
              color,
              r: 2 + Math.random() * 3,
            });
          }
        }

        // ---------- Utility ----------
        function dist(ax, ay, bx, by) {
          return Math.hypot(bx - ax, by - ay);
        }

        function clamp(v, lo, hi) {
          return Math.max(lo, Math.min(hi, v));
        }

        // Point-to-segment closest point
        function closestPointOnSegment(px, py, x1, y1, x2, y2) {
          const dx = x2 - x1,
            dy = y2 - y1;
          const lenSq = dx * dx + dy * dy;
          if (lenSq === 0) return { x: x1, y: y1 };
          let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
          t = clamp(t, 0, 1);
          return { x: x1 + t * dx, y: y1 + t * dy };
        }

        // ---------- Input ----------
        window.addEventListener("keydown", (e) => {
          keys[e.code] = true;
          if (["Space", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowUp"].includes(e.code)) {
            e.preventDefault();
          }
          // Plunger charge
          if ((e.code === "Space" || e.code === "ArrowDown") && gameRunning && !ballInPlay) {
            plungerHeld = true;
          }
        });

        window.addEventListener("keyup", (e) => {
          keys[e.code] = false;
          // Release plunger
          if (
            (e.code === "Space" || e.code === "ArrowDown") &&
            gameRunning &&
            !ballInPlay &&
            plungerHeld
          ) {
            launchBall();
            plungerHeld = false;
          }
        });

        // Button handlers
        document.getElementById("btn-start").addEventListener("click", startGame);
        document.getElementById("btn-restart").addEventListener("click", startGame);

        // ---------- Game Flow ----------
        function startGame() {
          score = 0;
          lives = MAX_LIVES;
          multiplier = 1;
          gameRunning = true;
          ballInPlay = false;
          plungerHeld = false;
          plungerPower = 0;
          startScreen.classList.remove("visible");
          gameoverScreen.classList.remove("visible");
          particles = [];
          resetBall();
          updateHUD();
        }

        function resetBall() {
          ball.x = PLUNGER_X;
          ball.y = CANVAS_H - 80;
          ball.vx = 0;
          ball.vy = 0;
          ballInPlay = false;
          plungerPower = 0;
          plungerHeld = false;
          multiplier = 1;
          updateHUD();
        }

        function launchBall() {
          const power = Math.max(plungerPower, 4);
          ball.vy = -power;
          ball.vx = -0.5 + Math.random() * 1;
          ballInPlay = true;
          plungerPower = 0;
          spawnParticles(ball.x, ball.y, "#ffaa22", 12);
        }

        function loseLife() {
          lives--;
          updateHUD();
          spawnParticles(ball.x, ball.y, "#ff4466", 20);

          if (lives <= 0) {
            gameOver();
          } else {
            resetBall();
          }
        }

        function gameOver() {
          gameRunning = false;
          ballInPlay = false;

          if (score > highScore) {
            highScore = score;
            localStorage.setItem("pinball-hi", String(highScore));
            highScoreMsg.textContent = "🏆 New High Score!";
          } else {
            highScoreMsg.textContent = `High Score: ${highScore.toLocaleString()}`;
          }
          finalScoreEl.textContent = `Score: ${score.toLocaleString()}`;
          gameoverScreen.classList.add("visible");
        }

        function addScore(pts) {
          score += pts * multiplier;
          updateHUD();
        }

        function updateHUD() {
          hudScore.textContent = score.toLocaleString();
          hudLives.textContent = "●".repeat(lives) + "○".repeat(MAX_LIVES - lives);
          hudMulti.textContent = `×${multiplier}`;
        }

        // ---------- Physics ----------
        function updateFlippers() {
          const leftActive = keys["ArrowLeft"] || keys["KeyA"];
          const rightActive = keys["ArrowRight"] || keys["KeyD"];

          flippers[0].targetAngle = leftActive ? FLIPPER_ACTIVE_ANGLE : FLIPPER_REST_ANGLE;
          flippers[1].targetAngle = rightActive ? -FLIPPER_ACTIVE_ANGLE : -FLIPPER_REST_ANGLE;

          for (const f of flippers) {
            const diff = f.targetAngle - f.angle;
            if (Math.abs(diff) < FLIPPER_SPEED) {
              f.angle = f.targetAngle;
            } else {
              f.angle += Math.sign(diff) * FLIPPER_SPEED;
            }
          }
        }

        function getFlipperTip(f) {
          const dir = f.side === "left" ? 1 : -1;
          return {
            x: f.pivotX + Math.cos(f.angle) * FLIPPER_LENGTH * dir,
            y: f.pivotY + Math.sin(f.angle) * FLIPPER_LENGTH,
          };
        }

        function collideFlippers() {
          for (const f of flippers) {
            const tip = getFlipperTip(f);
            const cp = closestPointOnSegment(ball.x, ball.y, f.pivotX, f.pivotY, tip.x, tip.y);
            const d = dist(ball.x, ball.y, cp.x, cp.y);
            const collisionDist = BALL_RADIUS + FLIPPER_THICKNESS / 2;

            if (d < collisionDist) {
              // Push ball out
              const nx = (ball.x - cp.x) / (d || 1);
              const ny = (ball.y - cp.y) / (d || 1);
              ball.x = cp.x + nx * (collisionDist + 1);
              ball.y = cp.y + ny * (collisionDist + 1);

              // Reflect velocity
              const dot = ball.vx * nx + ball.vy * ny;
              ball.vx -= 2 * dot * nx;
              ball.vy -= 2 * dot * ny;

              // Flipper boost — add angular velocity if flipper is swinging
              const angularSpeed = f.targetAngle !== f.angle ? FLIPPER_SPEED : 0;
              if (angularSpeed > 0) {
                const boost = FLIPPER_BOUNCE * 1.5;
                ball.vy -= boost * 3;
                ball.vx += (f.side === "left" ? 1 : -1) * boost * 1.2;
              }

              ball.vx *= FLIPPER_BOUNCE;
              ball.vy *= FLIPPER_BOUNCE;

              // Cap speed
              const speed = Math.hypot(ball.vx, ball.vy);
              if (speed > 18) {
                ball.vx = (ball.vx / speed) * 18;
                ball.vy = (ball.vy / speed) * 18;
              }
            }
          }
        }

        function collideBumpers() {
          for (const b of bumpers) {
            const d = dist(ball.x, ball.y, b.x, b.y);
            const minDist = BALL_RADIUS + b.r;
            if (d < minDist) {
              // Push out
              const nx = (ball.x - b.x) / (d || 1);
              const ny = (ball.y - b.y) / (d || 1);
              ball.x = b.x + nx * (minDist + 1);
              ball.y = b.y + ny * (minDist + 1);

              // Bounce
              ball.vx = nx * Math.abs(Math.hypot(ball.vx, ball.vy)) * BUMPER_BOUNCE;
              ball.vy = ny * Math.abs(Math.hypot(ball.vx, ball.vy)) * BUMPER_BOUNCE;

              // Min bounce speed
              const speed = Math.hypot(ball.vx, ball.vy);
              if (speed < 4) {
                ball.vx = (ball.vx / (speed || 1)) * 4;
                ball.vy = (ball.vy / (speed || 1)) * 4;
              }

              // Score & effects
              addScore(b.points);
              b.glow = 1;
              spawnParticles(ball.x, ball.y, b.color, 10);

              // Multiplier progression
              if (multiplier < 5) {
                multiplier++;
                updateHUD();
              }
            }
          }
        }

        function collideWalls() {
          for (const w of walls) {
            const cp = closestPointOnSegment(ball.x, ball.y, w.x1, w.y1, w.x2, w.y2);
            const d = dist(ball.x, ball.y, cp.x, cp.y);
            if (d < BALL_RADIUS) {
              const nx = (ball.x - cp.x) / (d || 1);
              const ny = (ball.y - cp.y) / (d || 1);
              ball.x = cp.x + nx * (BALL_RADIUS + 1);
              ball.y = cp.y + ny * (BALL_RADIUS + 1);

              const dot = ball.vx * nx + ball.vy * ny;
              ball.vx -= 2 * dot * nx;
              ball.vy -= 2 * dot * ny;
              ball.vx *= WALL_BOUNCE;
              ball.vy *= WALL_BOUNCE;
            }
          }
        }

        function collideSlingshots() {
          for (const s of slingshots) {
            // Use centroid for rough distance check
            const cx = (s.x1 + s.x2 + s.x3) / 3;
            const cy = (s.y1 + s.y2 + s.y3) / 3;
            if (dist(ball.x, ball.y, cx, cy) > 70) continue;

            // Check each edge
            const edges = [
              [s.x1, s.y1, s.x2, s.y2],
              [s.x2, s.y2, s.x3, s.y3],
              [s.x3, s.y3, s.x1, s.y1],
            ];
            for (const [ex1, ey1, ex2, ey2] of edges) {
              const cp = closestPointOnSegment(ball.x, ball.y, ex1, ey1, ex2, ey2);
              const d = dist(ball.x, ball.y, cp.x, cp.y);
              if (d < BALL_RADIUS + 4) {
                const nx = (ball.x - cp.x) / (d || 1);
                const ny = (ball.y - cp.y) / (d || 1);
                ball.x = cp.x + nx * (BALL_RADIUS + 5);
                ball.y = cp.y + ny * (BALL_RADIUS + 5);

                const speed = Math.hypot(ball.vx, ball.vy);
                ball.vx = nx * Math.max(speed, 5) * 1.3;
                ball.vy = ny * Math.max(speed, 5) * 1.3;

                addScore(50);
                s.glow = 1;
                spawnParticles(ball.x, ball.y, s.color, 8);
                break;
              }
            }
          }
        }

        function updateBall() {
          if (!ballInPlay) {
            // Charging plunger
            if (plungerHeld) {
              plungerPower = Math.min(plungerPower + PLUNGER_CHARGE_RATE, PLUNGER_MAX);
            }
            return;
          }

          // Gravity
          ball.vy += GRAVITY;

          // Friction
          ball.vx *= FRICTION;
          ball.vy *= FRICTION;

          // Move
          ball.x += ball.vx;
          ball.y += ball.vy;

          // Simple boundary clamp (left/right/top)
          if (ball.x - BALL_RADIUS < 20) {
            ball.x = 20 + BALL_RADIUS;
            ball.vx = Math.abs(ball.vx) * WALL_BOUNCE;
          }
          if (ball.x + BALL_RADIUS > 460) {
            ball.x = 460 - BALL_RADIUS;
            ball.vx = -Math.abs(ball.vx) * WALL_BOUNCE;
          }
          if (ball.y - BALL_RADIUS < 20) {
            ball.y = 20 + BALL_RADIUS;
            ball.vy = Math.abs(ball.vy) * WALL_BOUNCE;
          }

          // Collisions
          collideWalls();
          collideFlippers();
          collideBumpers();
          collideSlingshots();

          // Drain
          if (ball.y > CANVAS_H + BALL_RADIUS) {
            loseLife();
          }
        }

        function updateParticles() {
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.05;
            p.life -= p.decay;
            if (p.life <= 0) particles.splice(i, 1);
          }
        }

        // ---------- Rendering ----------
        function drawBackground() {
          // Dark gradient
          const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
          grad.addColorStop(0, "#0d0d1a");
          grad.addColorStop(0.5, "#111128");
          grad.addColorStop(1, "#0a0a18");
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

          // Subtle grid
          ctx.strokeStyle = "rgba(80, 60, 160, 0.06)";
          ctx.lineWidth = 1;
          for (let x = 0; x < CANVAS_W; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, CANVAS_H);
            ctx.stroke();
          }
          for (let y = 0; y < CANVAS_H; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(CANVAS_W, y);
            ctx.stroke();
          }
        }

        function drawWalls() {
          ctx.strokeStyle = "rgba(120, 80, 255, 0.5)";
          ctx.lineWidth = 3;
          ctx.shadowColor = "#7850ff";
          ctx.shadowBlur = 8;
          for (const w of walls) {
            ctx.beginPath();
            ctx.moveTo(w.x1, w.y1);
            ctx.lineTo(w.x2, w.y2);
            ctx.stroke();
          }
          ctx.shadowBlur = 0;
        }

        function drawFlippers() {
          for (const f of flippers) {
            const tip = getFlipperTip(f);
            const isActive =
              (f.side === "left" && (keys["ArrowLeft"] || keys["KeyA"])) ||
              (f.side === "right" && (keys["ArrowRight"] || keys["KeyD"]));
            const color = isActive ? "#ff44cc" : "#cc33aa";
            const glowColor = isActive ? "#ff44cc" : "#aa2288";

            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = FLIPPER_THICKNESS;
            ctx.lineCap = "round";
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = isActive ? 20 : 10;
            ctx.beginPath();
            ctx.moveTo(f.pivotX, f.pivotY);
            ctx.lineTo(tip.x, tip.y);
            ctx.stroke();

            // Pivot circle
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(f.pivotX, f.pivotY, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        function drawBumpers() {
          for (const b of bumpers) {
            b.glow = Math.max(0, b.glow - 0.03);
            const glowIntensity = 10 + b.glow * 30;
            const scale = 1 + b.glow * 0.15;

            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.scale(scale, scale);

            // Outer glow
            ctx.shadowColor = b.color;
            ctx.shadowBlur = glowIntensity;

            // Ring
            ctx.strokeStyle = b.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, b.r, 0, Math.PI * 2);
            ctx.stroke();

            // Fill
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, b.r);
            grad.addColorStop(0, b.color + "44");
            grad.addColorStop(0.7, b.color + "18");
            grad.addColorStop(1, "transparent");
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, b.r, 0, Math.PI * 2);
            ctx.fill();

            // Center dot
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();

            // Points text
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#ffffff88";
            ctx.font = "bold 10px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(String(b.points), 0, b.r + 14);

            ctx.restore();
          }
        }

        function drawSlingshots() {
          for (const s of slingshots) {
            s.glow = Math.max(0, (s.glow || 0) - 0.03);
            const glowIntensity = 5 + s.glow * 25;

            ctx.save();
            ctx.shadowColor = s.color;
            ctx.shadowBlur = glowIntensity;
            ctx.strokeStyle = s.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(s.x1, s.y1);
            ctx.lineTo(s.x2, s.y2);
            ctx.lineTo(s.x3, s.y3);
            ctx.closePath();
            ctx.stroke();
            ctx.fillStyle = s.color + "15";
            ctx.fill();
            ctx.restore();
          }
        }

        function drawPlunger() {
          if (ballInPlay) return;

          const plungerY = CANVAS_H - 30;
          const chargeHeight = (plungerPower / PLUNGER_MAX) * 60;

          // Track
          ctx.fillStyle = "#1a1a30";
          ctx.fillRect(PLUNGER_X - 8, plungerY - 70, 16, 70);

          // Spring coils
          ctx.strokeStyle = "#555577";
          ctx.lineWidth = 2;
          for (let i = 0; i < 5; i++) {
            const yy = plungerY - i * 10 + chargeHeight * 0.6;
            if (yy < plungerY - 70) break;
            ctx.beginPath();
            ctx.moveTo(PLUNGER_X - 6, yy);
            ctx.lineTo(PLUNGER_X + 6, yy);
            ctx.stroke();
          }

          // Plunger head
          const headY = plungerY - 5 + chargeHeight * 0.5;
          const glowColor =
            plungerPower > 0
              ? `rgba(255, 170, 34, ${0.3 + (plungerPower / PLUNGER_MAX) * 0.7})`
              : "transparent";
          ctx.shadowColor = "#ffaa22";
          ctx.shadowBlur = plungerPower > 0 ? 15 : 0;
          ctx.fillStyle = plungerPower > PLUNGER_MAX * 0.7 ? "#ff6622" : "#ffaa22";
          ctx.beginPath();
          ctx.roundRect(PLUNGER_X - 7, headY - 12, 14, 14, 3);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Power indicator
          if (plungerPower > 0) {
            ctx.fillStyle = "#ffaa22";
            ctx.font = "bold 11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(
              `${Math.round((plungerPower / PLUNGER_MAX) * 100)}%`,
              PLUNGER_X,
              plungerY + 18,
            );
          } else {
            ctx.fillStyle = "#666688";
            ctx.font = "10px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("SPACE", PLUNGER_X, plungerY + 18);
          }
        }

        function drawBall() {
          if (!ballInPlay && !gameRunning) return;

          ctx.save();

          // Trail
          const speed = Math.hypot(ball.vx, ball.vy);
          if (speed > 2 && ballInPlay) {
            const trailLen = Math.min(speed * 2, 30);
            const nx = -ball.vx / speed;
            const ny = -ball.vy / speed;
            const grad = ctx.createLinearGradient(
              ball.x,
              ball.y,
              ball.x + nx * trailLen,
              ball.y + ny * trailLen,
            );
            grad.addColorStop(0, "rgba(255, 200, 100, 0.5)");
            grad.addColorStop(1, "transparent");
            ctx.strokeStyle = grad;
            ctx.lineWidth = BALL_RADIUS * 1.5;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(ball.x + nx * trailLen, ball.y + ny * trailLen);
            ctx.stroke();
          }

          // Glow
          ctx.shadowColor = "#ffcc44";
          ctx.shadowBlur = 15;

          // Ball body
          const ballGrad = ctx.createRadialGradient(
            ball.x - 2,
            ball.y - 2,
            1,
            ball.x,
            ball.y,
            BALL_RADIUS,
          );
          ballGrad.addColorStop(0, "#ffffff");
          ballGrad.addColorStop(0.3, "#ffdd88");
          ballGrad.addColorStop(1, "#cc8822");
          ctx.fillStyle = ballGrad;
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
          ctx.fill();

          // Highlight
          ctx.fillStyle = "rgba(255,255,255,0.6)";
          ctx.beginPath();
          ctx.arc(ball.x - 2, ball.y - 2, BALL_RADIUS * 0.35, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }

        function drawParticles() {
          for (const p of particles) {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 6;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        function drawDrainZone() {
          // Gutter opening glow
          const grad = ctx.createLinearGradient(80, CANVAS_H - 40, 80, CANVAS_H);
          grad.addColorStop(0, "transparent");
          grad.addColorStop(1, "rgba(255, 30, 60, 0.15)");
          ctx.fillStyle = grad;
          ctx.fillRect(80, CANVAS_H - 40, PLUNGER_LANE_LEFT - 80 - 50, 40);

          // Danger lines
          ctx.strokeStyle = "rgba(255, 30, 60, 0.3)";
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(80, CANVAS_H - 5);
          ctx.lineTo(PLUNGER_LANE_LEFT - 50, CANVAS_H - 5);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // ---------- Main Loop ----------
        function gameLoop() {
          // Update
          if (gameRunning) {
            updateFlippers();
            updateBall();
          }
          updateParticles();

          // Decay bumper glows even when paused for visual smoothness
          for (const b of bumpers) {
            b.glow = Math.max(0, b.glow - 0.02);
          }

          // Draw
          drawBackground();
          drawDrainZone();
          drawWalls();
          drawSlingshots();
          drawBumpers();
          drawFlippers();
          drawPlunger();
          drawBall();
          drawParticles();

          requestAnimationFrame(gameLoop);
        }

        // ---------- Initial HUD ----------
        updateHUD();

        // ---------- Start ----------
        gameLoop();
      })();
    </script>
  </body>
</html>
