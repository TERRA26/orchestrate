<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Snake — Games Portal</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        overflow: hidden;
      }

      .game-header {
        /* spacer on the right to balance the back-link and center the title */
      }

      .game-header .spacer {
        width: 80px;
      }

      .canvas-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      canvas {
        display: block;
        border: 2px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow:
          var(--shadow-md),
          0 0 60px rgba(124, 92, 252, 0.08);
        background: var(--bg-surface);
        max-width: 100%;
        touch-action: none;
      }

      /* ── Start overlay ── */
      .start-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 15, 26, 0.88);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.35s var(--ease-out);
      }

      .start-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .start-modal {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 2.5rem;
        text-align: center;
        max-width: 380px;
        width: 90%;
        box-shadow: var(--shadow-lg);
        transform: scale(1);
        transition: transform 0.3s var(--ease-bounce);
      }

      .start-overlay.hidden .start-modal {
        transform: scale(0.9) translateY(20px);
      }

      .start-modal .snake-icon {
        font-size: 3.5rem;
        margin-bottom: 0.75rem;
      }

      .start-modal h2 {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 0.4rem;
        color: var(--text-primary);
      }

      .start-modal p {
        color: var(--text-secondary);
        margin-bottom: 1.5rem;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .start-modal .controls-hint {
        color: var(--text-muted);
        font-size: 0.8rem;
        margin-top: 1rem;
      }

      .start-modal kbd {
        display: inline-block;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0.1rem 0.45rem;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin: 0 0.1rem;
      }

      /* ── Game-over modal tweaks ── */
      .modal .final-score {
        font-size: 3rem;
        font-weight: 700;
        color: var(--accent-light);
        margin: 0.75rem 0;
        font-variant-numeric: tabular-nums;
      }

      .modal .high-score-note {
        color: var(--success);
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }

      .modal .btn + .btn {
        margin-left: 0.5rem;
      }

      /* ── Paused indicator ── */
      .paused-badge {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg-card);
        color: var(--warning);
        border: 1px solid var(--warning);
        border-radius: var(--radius-sm);
        padding: 0.4rem 1.2rem;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        z-index: 500;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s var(--ease-out);
      }

      .paused-badge.visible {
        opacity: 1;
      }

      /* ── Responsive ── */
      @media (max-width: 640px) {
        .game-container {
          padding: 0.75rem 0.5rem;
        }

        .score-bar {
          margin-bottom: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="game-header">
      <a href="/" class="back-link">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 18l-6-6 6-6" />
        </svg>
        Games
      </a>
      <h1>Snake</h1>
      <span class="spacer"></span>
    </header>

    <!-- Score bar -->
    <div class="game-container" id="gameContainer">
      <div class="score-bar">
        <div class="score-item">
          <div class="label">Score</div>
          <div class="value" id="scoreDisplay">0</div>
        </div>
        <div class="score-item">
          <div class="label">High Score</div>
          <div class="value" id="highScoreDisplay">0</div>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="gameCanvas"></canvas>
      </div>
    </div>

    <!-- Paused indicator -->
    <div class="paused-badge" id="pausedBadge">Paused</div>

    <!-- Start screen overlay -->
    <div class="start-overlay" id="startOverlay">
      <div class="start-modal">
        <div class="snake-icon">🐍</div>
        <h2>Snake</h2>
        <p>Eat food to grow longer. Don't hit the walls or yourself!</p>
        <button class="btn btn-primary btn-lg" id="startBtn">Start Game</button>
        <div class="controls-hint">
          <kbd>Arrow Keys</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move
          &nbsp;&middot;&nbsp; <kbd>Space</kbd> to pause
        </div>
      </div>
    </div>

    <!-- Game-over overlay -->
    <div class="overlay" id="gameOverOverlay">
      <div class="modal">
        <h2>Game Over</h2>
        <div class="final-score" id="finalScore">0</div>
        <div class="high-score-note hidden" id="newHighScore">New High Score!</div>
        <p id="gameOverMsg">Better luck next time.</p>
        <button class="btn btn-primary btn-lg" id="restartBtn">Play Again</button>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        /* ── Constants ── */
        const COLS = 20;
        const ROWS = 20;
        const BASE_SPEED = 150; // ms per tick at score 0
        const MIN_SPEED = 60; // fastest tick
        const SPEED_FACTOR = 3; // ms removed per point

        /* ── Colors (matching CSS variables) ── */
        const COLOR = {
          bg: "#16162b",
          grid: "#1c1c38",
          snakeHead: "#9b82ff",
          snakeBody: "#7c5cfc",
          snakeTail: "#5a3de6",
          food: "#f87171",
          foodGlow: "rgba(248, 113, 113, 0.35)",
        };

        /* ── Direction helpers ── */
        const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
        const DELTA = {
          [DIR.UP]: { x: 0, y: -1 },
          [DIR.RIGHT]: { x: 1, y: 0 },
          [DIR.DOWN]: { x: 0, y: 1 },
          [DIR.LEFT]: { x: -1, y: 0 },
        };
        const OPPOSITE = {
          [DIR.UP]: DIR.DOWN,
          [DIR.DOWN]: DIR.UP,
          [DIR.LEFT]: DIR.RIGHT,
          [DIR.RIGHT]: DIR.LEFT,
        };

        /* ── DOM refs ── */
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const highScoreDisplay = document.getElementById("highScoreDisplay");
        const startOverlay = document.getElementById("startOverlay");
        const startBtn = document.getElementById("startBtn");
        const gameOverOverlay = document.getElementById("gameOverOverlay");
        const finalScoreEl = document.getElementById("finalScore");
        const newHighScoreEl = document.getElementById("newHighScore");
        const gameOverMsg = document.getElementById("gameOverMsg");
        const restartBtn = document.getElementById("restartBtn");
        const pausedBadge = document.getElementById("pausedBadge");
        const containerEl = document.getElementById("gameContainer");

        /* ── State ── */
        let snake,
          direction,
          nextDirection,
          food,
          score,
          highScore,
          running,
          paused,
          loopTimer,
          cellSize;

        /* ── Sizing ── */
        function sizeCanvas() {
          const headerH = 60;
          const scoreBarH = document.querySelector(".score-bar").offsetHeight;
          const containerPad = parseFloat(getComputedStyle(containerEl).paddingTop) * 2;
          const available = Math.min(
            containerEl.clientWidth - parseFloat(getComputedStyle(containerEl).paddingLeft) * 2,
            window.innerHeight - headerH - scoreBarH - containerPad - 24,
          );
          cellSize = Math.floor(Math.max(available, 200) / COLS);
          canvas.width = cellSize * COLS;
          canvas.height = cellSize * ROWS;
        }

        /* ── High-score persistence ── */
        function loadHighScore() {
          try {
            highScore = parseInt(localStorage.getItem("snake_highscore"), 10) || 0;
          } catch {
            highScore = 0;
          }
          highScoreDisplay.textContent = highScore;
        }
        function saveHighScore() {
          try {
            localStorage.setItem("snake_highscore", highScore);
          } catch {
            /* noop */
          }
        }

        /* ── Init / reset game state ── */
        function resetGame() {
          const midX = Math.floor(COLS / 2);
          const midY = Math.floor(ROWS / 2);
          snake = [
            { x: midX, y: midY },
            { x: midX - 1, y: midY },
            { x: midX - 2, y: midY },
          ];
          direction = DIR.RIGHT;
          nextDirection = DIR.RIGHT;
          score = 0;
          paused = false;
          scoreDisplay.textContent = "0";
          pausedBadge.classList.remove("visible");
          placeFood();
        }

        /* ── Food placement ── */
        function placeFood() {
          const occupied = new Set(snake.map((s) => `${s.x},${s.y}`));
          let attempts = 0;
          do {
            food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
            attempts++;
          } while (occupied.has(`${food.x},${food.y}`) && attempts < 1000);
        }

        /* ── Drawing ── */
        function draw() {
          const cs = cellSize;

          // Background
          ctx.fillStyle = COLOR.bg;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Grid lines
          ctx.strokeStyle = COLOR.grid;
          ctx.lineWidth = 0.5;
          for (let x = 0; x <= COLS; x++) {
            ctx.beginPath();
            ctx.moveTo(x * cs, 0);
            ctx.lineTo(x * cs, ROWS * cs);
            ctx.stroke();
          }
          for (let y = 0; y <= ROWS; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y * cs);
            ctx.lineTo(COLS * cs, y * cs);
            ctx.stroke();
          }

          // Food (with glow)
          const fx = food.x * cs + cs / 2;
          const fy = food.y * cs + cs / 2;
          const foodR = cs * 0.38;
          ctx.save();
          ctx.shadowColor = COLOR.foodGlow;
          ctx.shadowBlur = 14;
          ctx.fillStyle = COLOR.food;
          ctx.beginPath();
          ctx.arc(fx, fy, foodR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Snake
          const len = snake.length;
          for (let i = 0; i < len; i++) {
            const seg = snake[i];
            const t = len > 1 ? i / (len - 1) : 0; // 0=head, 1=tail
            const pad = cs * 0.08;

            // Gradient from head to tail
            if (i === 0) {
              ctx.fillStyle = COLOR.snakeHead;
            } else {
              // Interpolate body -> tail
              const r = lerp(0x7c, 0x5a, t);
              const g = lerp(0x5c, 0x3d, t);
              const b = lerp(0xfc, 0xe6, t);
              ctx.fillStyle = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
            }

            const radius = i === 0 ? cs * 0.22 : cs * 0.16;
            roundRect(ctx, seg.x * cs + pad, seg.y * cs + pad, cs - pad * 2, cs - pad * 2, radius);
            ctx.fill();

            // Eyes on head
            if (i === 0) {
              drawEyes(seg, cs);
            }
          }
        }

        function drawEyes(head, cs) {
          const cx = head.x * cs + cs / 2;
          const cy = head.y * cs + cs / 2;
          const eyeR = cs * 0.07;
          const offset = cs * 0.18;
          let e1, e2;

          switch (direction) {
            case DIR.UP:
              e1 = { x: cx - offset, y: cy - offset };
              e2 = { x: cx + offset, y: cy - offset };
              break;
            case DIR.DOWN:
              e1 = { x: cx - offset, y: cy + offset };
              e2 = { x: cx + offset, y: cy + offset };
              break;
            case DIR.LEFT:
              e1 = { x: cx - offset, y: cy - offset };
              e2 = { x: cx - offset, y: cy + offset };
              break;
            case DIR.RIGHT:
              e1 = { x: cx + offset, y: cy - offset };
              e2 = { x: cx + offset, y: cy + offset };
              break;
          }

          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(e1.x, e1.y, eyeR, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(e2.x, e2.y, eyeR, 0, Math.PI * 2);
          ctx.fill();
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function roundRect(ctx, x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.arcTo(x + w, y, x + w, y + r, r);
          ctx.lineTo(x + w, y + h - r);
          ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
          ctx.lineTo(x + r, y + h);
          ctx.arcTo(x, y + h, x, y + h - r, r);
          ctx.lineTo(x, y + r);
          ctx.arcTo(x, y, x + r, y, r);
          ctx.closePath();
        }

        /* ── Game tick ── */
        function tick() {
          if (!running || paused) return;

          direction = nextDirection;
          const head = snake[0];
          const d = DELTA[direction];
          const newHead = { x: head.x + d.x, y: head.y + d.y };

          // Wall collision
          if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
            return gameOver();
          }

          // Self collision (check against all but the tail, which will move away)
          for (let i = 0; i < snake.length - 1; i++) {
            if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
              return gameOver();
            }
          }

          snake.unshift(newHead);

          // Eat food?
          if (newHead.x === food.x && newHead.y === food.y) {
            score++;
            scoreDisplay.textContent = score;
            placeFood();
            // Schedule next tick faster
            scheduleNextTick();
          } else {
            snake.pop();
            scheduleNextTick();
          }

          draw();
        }

        function currentSpeed() {
          return Math.max(MIN_SPEED, BASE_SPEED - score * SPEED_FACTOR);
        }

        function scheduleNextTick() {
          clearTimeout(loopTimer);
          loopTimer = setTimeout(tick, currentSpeed());
        }

        /* ── Game over ── */
        function gameOver() {
          running = false;
          clearTimeout(loopTimer);

          const isNew = score > highScore;
          if (isNew) {
            highScore = score;
            highScoreDisplay.textContent = highScore;
            saveHighScore();
          }

          finalScoreEl.textContent = score;
          newHighScoreEl.classList.toggle("hidden", !isNew);
          gameOverMsg.textContent = isNew ? "Incredible run!" : "Better luck next time.";
          gameOverOverlay.classList.add("active");
        }

        /* ── Start / restart ── */
        function startGame() {
          startOverlay.classList.add("hidden");
          gameOverOverlay.classList.remove("active");
          resetGame();
          running = true;
          draw();
          scheduleNextTick();
        }

        /* ── Input: keyboard ── */
        function handleKey(e) {
          const key = e.key;

          // Start game on any key if start overlay visible
          if (!startOverlay.classList.contains("hidden")) {
            startGame();
            e.preventDefault();
            return;
          }

          // Restart on Enter/Space when game over
          if (!running && gameOverOverlay.classList.contains("active")) {
            if (key === "Enter" || key === " ") {
              startGame();
              e.preventDefault();
              return;
            }
          }

          // Pause toggle
          if (key === " " || key === "Escape" || key === "p" || key === "P") {
            if (running) {
              paused = !paused;
              pausedBadge.classList.toggle("visible", paused);
              if (!paused) scheduleNextTick();
              e.preventDefault();
              return;
            }
          }

          // Direction
          let newDir = null;
          switch (key) {
            case "ArrowUp":
            case "w":
            case "W":
              newDir = DIR.UP;
              break;
            case "ArrowDown":
            case "s":
            case "S":
              newDir = DIR.DOWN;
              break;
            case "ArrowLeft":
            case "a":
            case "A":
              newDir = DIR.LEFT;
              break;
            case "ArrowRight":
            case "d":
            case "D":
              newDir = DIR.RIGHT;
              break;
          }
          if (newDir !== null && newDir !== OPPOSITE[direction]) {
            nextDirection = newDir;
            e.preventDefault();
          }
        }

        /* ── Input: touch / swipe ── */
        let touchStartX = 0,
          touchStartY = 0;

        function handleTouchStart(e) {
          // Start game on tap if start overlay visible
          if (!startOverlay.classList.contains("hidden")) {
            return; // let the button handle it
          }

          const touch = e.touches[0];
          touchStartX = touch.clientX;
          touchStartY = touch.clientY;
        }

        function handleTouchEnd(e) {
          if (!running || paused) return;

          const touch = e.changedTouches[0];
          const dx = touch.clientX - touchStartX;
          const dy = touch.clientY - touchStartY;
          const absDx = Math.abs(dx);
          const absDy = Math.abs(dy);

          // Minimum swipe distance
          if (Math.max(absDx, absDy) < 20) return;

          let newDir;
          if (absDx > absDy) {
            newDir = dx > 0 ? DIR.RIGHT : DIR.LEFT;
          } else {
            newDir = dy > 0 ? DIR.DOWN : DIR.UP;
          }

          if (newDir !== OPPOSITE[direction]) {
            nextDirection = newDir;
          }
        }

        /* ── Bootstrap ── */
        function init() {
          loadHighScore();
          sizeCanvas();
          resetGame();
          draw();

          // Events
          window.addEventListener("keydown", handleKey);
          canvas.addEventListener("touchstart", handleTouchStart, { passive: true });
          canvas.addEventListener("touchend", handleTouchEnd, { passive: true });
          startBtn.addEventListener("click", startGame);
          restartBtn.addEventListener("click", startGame);

          window.addEventListener("resize", () => {
            sizeCanvas();
            draw();
          });

          // Lose focus -> pause
          window.addEventListener("blur", () => {
            if (running && !paused) {
              paused = true;
              pausedBadge.classList.toggle("visible", paused);
            }
          });
        }

        // Helper to hide new-high-score note initially
        document.head.insertAdjacentHTML(
          "beforeend",
          "<style>.hidden{display:none!important}</style>",
        );

        init();
      })();
    </script>
  </body>
</html>
