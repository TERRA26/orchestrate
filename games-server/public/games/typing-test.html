<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Typing Speed Test — Games Portal</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .game-header .spacer {
        width: 80px;
      }

      /* ── Passage display ── */
      .passage-wrapper {
        position: relative;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 1.75rem 1.5rem;
        margin-bottom: 1.5rem;
        cursor: text;
        overflow: hidden;
        min-height: 140px;
      }

      .progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 3px;
        background: var(--accent);
        border-radius: 2px;
        transition: width 0.15s var(--ease-out);
        box-shadow: 0 0 8px var(--accent-glow);
      }

      .passage-text {
        font-family: var(--font-mono);
        font-size: 1.25rem;
        line-height: 2;
        letter-spacing: 0.01em;
        user-select: none;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .char {
        position: relative;
        transition: color 0.08s;
      }

      .char.pending {
        color: var(--text-muted);
      }

      .char.correct {
        color: var(--success);
      }

      .char.incorrect {
        color: var(--danger);
        background: rgba(248, 113, 113, 0.15);
        border-radius: 2px;
      }

      .char.current {
        color: var(--text-primary);
        border-bottom: 2px solid var(--accent-light);
        animation: cursorBlink 1s step-end infinite;
      }

      @keyframes cursorBlink {
        0%,
        100% {
          border-bottom-color: var(--accent-light);
        }
        50% {
          border-bottom-color: transparent;
        }
      }

      /* ── Hidden input ── */
      .hidden-input {
        position: absolute;
        left: -9999px;
        top: -9999px;
        opacity: 0;
        width: 1px;
        height: 1px;
      }

      /* ── Start prompt ── */
      .start-prompt {
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 1rem;
        min-height: 1.5rem;
      }

      .start-prompt .kbd {
        display: inline-block;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.15rem 0.5rem;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--text-primary);
        margin: 0 0.15rem;
      }

      /* ── Result modal extras ── */
      .result-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin: 1.5rem 0;
      }

      .result-stat {
        background: var(--bg-surface);
        border-radius: var(--radius-sm);
        padding: 0.8rem 0.5rem;
      }

      .result-stat .stat-label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.2rem;
      }

      .result-stat .stat-value {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
      }

      .result-stat .stat-value.highlight {
        color: var(--accent-light);
      }

      .result-stat .stat-value.success {
        color: var(--success);
      }

      .result-stat .stat-value.danger {
        color: var(--danger);
      }

      .modal h2 {
        font-size: 1.5rem;
      }

      /* ── Timer warning pulse ── */
      .score-item .value.time-warning {
        color: var(--danger);
        animation: pulse 0.6s ease-in-out infinite alternate;
      }

      @keyframes pulse {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.5;
        }
      }

      /* ── Responsive ── */
      @media (max-width: 640px) {
        .passage-text {
          font-size: 1rem;
          line-height: 1.85;
        }

        .passage-wrapper {
          padding: 1.25rem 1rem;
        }

        .result-stats {
          grid-template-columns: 1fr 1fr;
          gap: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header class="game-header">
      <a href="/" class="back-link">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 18 9 12 15 6" />
        </svg>
        Back
      </a>
      <h1>Typing Speed Test</h1>
      <div class="spacer"></div>
    </header>

    <main class="game-container">
      <!-- Duration selector -->
      <div class="mode-selector" id="modeSelector">
        <button class="btn btn-secondary" data-duration="30">30s</button>
        <button class="btn btn-secondary active" data-duration="60">60s</button>
        <button class="btn btn-secondary" data-duration="120">120s</button>
      </div>

      <!-- Stats bar -->
      <div class="score-bar">
        <div class="score-item">
          <div class="label">WPM</div>
          <div class="value" id="wpmDisplay">0</div>
        </div>
        <div class="score-item">
          <div class="label">Accuracy</div>
          <div class="value" id="accuracyDisplay">100%</div>
        </div>
        <div class="score-item">
          <div class="label">Time</div>
          <div class="value" id="timeDisplay">60</div>
        </div>
      </div>

      <!-- Start prompt -->
      <div class="start-prompt" id="startPrompt">Start typing to begin the test</div>

      <!-- Passage area -->
      <div class="passage-wrapper" id="passageWrapper">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        <div class="passage-text" id="passageText"></div>
      </div>

      <!-- Hidden input -->
      <input
        type="text"
        class="hidden-input"
        id="hiddenInput"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Type the passage here"
      />
    </main>

    <!-- Results overlay -->
    <div class="overlay" id="resultsOverlay">
      <div class="modal">
        <h2 id="resultTitle">Time's Up!</h2>
        <p id="resultSubtitle">Here's how you did</p>
        <div class="result-stats">
          <div class="result-stat">
            <div class="stat-label">WPM</div>
            <div class="stat-value highlight" id="finalWpm">0</div>
          </div>
          <div class="result-stat">
            <div class="stat-label">Accuracy</div>
            <div class="stat-value success" id="finalAccuracy">0%</div>
          </div>
          <div class="result-stat">
            <div class="stat-label">Correct</div>
            <div class="stat-value" id="finalCorrect" style="color: var(--success)">0</div>
          </div>
          <div class="result-stat">
            <div class="stat-label">Incorrect</div>
            <div class="stat-value" id="finalIncorrect" style="color: var(--danger)">0</div>
          </div>
        </div>
        <div class="result-stats" style="margin-top: 0">
          <div class="result-stat" style="grid-column: 1 / -1">
            <div class="stat-label">Characters Typed</div>
            <div class="stat-value" id="finalTotal">0</div>
          </div>
        </div>
        <button
          class="btn btn-primary btn-lg"
          id="tryAgainBtn"
          style="margin-top: 0.5rem; width: 100%"
        >
          Try Again
        </button>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // ── Passages ──
        const passages = [
          "The quick brown fox jumps over the lazy dog near the riverbank. Bright sunlight filters through the canopy of ancient oaks as birds sing melodies that echo across the valley floor, filling the morning air with warmth and gentle wonder.",
          "Programming is the art of telling a computer what to do. Every line of code represents a decision, a small step toward solving a complex problem. With practice and patience, even the most difficult bugs can be tracked down and resolved efficiently.",
          "The ocean stretches endlessly toward the horizon, its surface glittering under the afternoon sun. Waves crash rhythmically against the rocky shore as seagulls circle overhead, their calls carried away by the salty breeze that sweeps along the coastline.",
          "Technology continues to evolve at a remarkable pace, transforming how we communicate, work, and live. From artificial intelligence to quantum computing, breakthroughs emerge that challenge our understanding of what machines can accomplish alongside human creativity.",
          "A well-designed keyboard is a joy to type on. The satisfying click of mechanical switches, the smooth travel of each keystroke, and the responsive feedback make every word feel deliberate. Good tools inspire good work, and great typing starts with practice.",
          "Mountains rise above the clouds in silent grandeur, their snow-capped peaks catching the first rays of dawn. Hikers follow narrow trails through alpine meadows where wildflowers bloom in bursts of purple, yellow, and white against the dark green forest.",
          "Reading expands the mind in ways that few other activities can match. Each book opens a door to a different world, a unique perspective, or a fresh idea. The habit of reading daily builds knowledge, empathy, and the ability to think more clearly.",
          "Coffee shops hum with quiet energy as people tap away at laptops and scribble in notebooks. The aroma of freshly ground beans mingles with soft background music, creating an atmosphere that fuels creativity and focused concentration throughout the afternoon.",
          "The art of writing clean code lies in simplicity and clarity. Functions should do one thing well, variable names should reveal intent, and comments should explain why rather than what. Readable code is maintainable code, and maintainable code endures over time.",
          "Stars fill the night sky like scattered diamonds on dark velvet. Far from city lights, the Milky Way stretches across the heavens in a luminous band, reminding us of the vast universe that exists beyond the familiar boundaries of our small blue planet.",
        ];

        // ── DOM refs ──
        const modeSelector = document.getElementById("modeSelector");
        const wpmDisplay = document.getElementById("wpmDisplay");
        const accuracyDisplay = document.getElementById("accuracyDisplay");
        const timeDisplay = document.getElementById("timeDisplay");
        const startPrompt = document.getElementById("startPrompt");
        const passageWrapper = document.getElementById("passageWrapper");
        const passageText = document.getElementById("passageText");
        const progressBar = document.getElementById("progressBar");
        const hiddenInput = document.getElementById("hiddenInput");
        const resultsOverlay = document.getElementById("resultsOverlay");
        const finalWpm = document.getElementById("finalWpm");
        const finalAccuracy = document.getElementById("finalAccuracy");
        const finalCorrect = document.getElementById("finalCorrect");
        const finalIncorrect = document.getElementById("finalIncorrect");
        const finalTotal = document.getElementById("finalTotal");
        const tryAgainBtn = document.getElementById("tryAgainBtn");
        const resultTitle = document.getElementById("resultTitle");

        // ── State ──
        let duration = 60;
        let timeRemaining = 60;
        let timerInterval = null;
        let started = false;
        let finished = false;
        let startTime = null;
        let currentText = "";
        let charIndex = 0;
        let totalKeystrokes = 0;
        let correctKeystrokes = 0;
        let incorrectKeystrokes = 0;
        let charElements = [];
        let lastUsedPassageIndex = -1;

        // ── Passage selection (avoid immediate repeats) ──
        function pickPassage() {
          let idx;
          do {
            idx = Math.floor(Math.random() * passages.length);
          } while (idx === lastUsedPassageIndex && passages.length > 1);
          lastUsedPassageIndex = idx;
          return passages[idx];
        }

        // ── Render passage into character spans ──
        function renderPassage(text) {
          currentText = text;
          charIndex = 0;
          passageText.innerHTML = "";
          charElements = [];

          for (let i = 0; i < text.length; i++) {
            const span = document.createElement("span");
            span.className = "char pending";
            span.textContent = text[i];
            passageText.appendChild(span);
            charElements.push(span);
          }

          if (charElements.length > 0) {
            charElements[0].classList.remove("pending");
            charElements[0].classList.add("current");
          }

          progressBar.style.width = "0%";
        }

        // ── Load a new passage (when user finishes one mid-test) ──
        function loadNextPassage() {
          renderPassage(pickPassage());
          hiddenInput.value = "";
        }

        // ── Update stats display ──
        function updateStats() {
          if (!startTime) return;

          const elapsedMs = Date.now() - startTime;
          const elapsedMin = elapsedMs / 60000;

          // WPM: correct characters / 5 / elapsed minutes
          const wpm = elapsedMin > 0 ? Math.round(correctKeystrokes / 5 / elapsedMin) : 0;
          wpmDisplay.textContent = wpm;

          // Accuracy
          const accuracy =
            totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;
          accuracyDisplay.textContent = accuracy + "%";
        }

        // ── Timer ──
        function startTimer() {
          startTime = Date.now();
          timerInterval = setInterval(function () {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            timeRemaining = Math.max(0, duration - elapsed);
            timeDisplay.textContent = timeRemaining;

            // Warning state when < 10s
            if (timeRemaining <= 10) {
              timeDisplay.classList.add("time-warning");
            } else {
              timeDisplay.classList.remove("time-warning");
            }

            updateStats();

            if (timeRemaining <= 0) {
              endTest();
            }
          }, 200);
        }

        function stopTimer() {
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
        }

        // ── End test ──
        function endTest() {
          finished = true;
          stopTimer();
          updateStats();

          const elapsedMs = Date.now() - startTime;
          const elapsedMin = elapsedMs / 60000;
          const wpm = elapsedMin > 0 ? Math.round(correctKeystrokes / 5 / elapsedMin) : 0;
          const accuracy =
            totalKeystrokes > 0 ? Math.round((correctKeystrokes / totalKeystrokes) * 100) : 100;

          finalWpm.textContent = wpm;
          finalAccuracy.textContent = accuracy + "%";
          finalCorrect.textContent = correctKeystrokes;
          finalIncorrect.textContent = incorrectKeystrokes;
          finalTotal.textContent = totalKeystrokes;

          if (timeRemaining <= 0) {
            resultTitle.textContent = "Time's Up!";
          } else {
            resultTitle.textContent = "Great Job!";
          }

          resultsOverlay.classList.add("active");
        }

        // ── Reset ──
        function resetTest() {
          stopTimer();
          started = false;
          finished = false;
          startTime = null;
          totalKeystrokes = 0;
          correctKeystrokes = 0;
          incorrectKeystrokes = 0;
          timeRemaining = duration;

          wpmDisplay.textContent = "0";
          accuracyDisplay.textContent = "100%";
          timeDisplay.textContent = duration;
          timeDisplay.classList.remove("time-warning");
          startPrompt.textContent = "Start typing to begin the test";

          resultsOverlay.classList.remove("active");

          renderPassage(pickPassage());
          hiddenInput.value = "";
          focusInput();
        }

        // ── Focus management ──
        function focusInput() {
          hiddenInput.focus({ preventScroll: true });
        }

        // ── Input handling ──
        function handleInput(e) {
          if (finished) return;

          // Prevent paste
          if (e.inputType === "insertFromPaste" || e.inputType === "insertFromDrop") {
            hiddenInput.value = "";
            return;
          }

          // Start on first keypress
          if (!started) {
            started = true;
            startPrompt.textContent = "";
            startTimer();
          }

          const inputVal = hiddenInput.value;

          // Handle backspace (deletion)
          if (e.inputType === "deleteContentBackward" || e.inputType === "deleteContentForward") {
            if (charIndex > 0) {
              charIndex--;
              charElements[charIndex].className = "char current";
              // Clear any character beyond current position
              for (let i = charIndex + 1; i < charElements.length; i++) {
                if (
                  charElements[i].classList.contains("correct") ||
                  charElements[i].classList.contains("incorrect")
                ) {
                  charElements[i].className = "char pending";
                } else {
                  break;
                }
              }
              updateProgress();
            }
            // Sync input value to match charIndex
            hiddenInput.value = currentText.substring(0, charIndex);
            return;
          }

          // Normal character input
          if (charIndex < currentText.length && inputVal.length > charIndex) {
            const typedChar = inputVal[charIndex];
            const expectedChar = currentText[charIndex];

            totalKeystrokes++;

            if (typedChar === expectedChar) {
              correctKeystrokes++;
              charElements[charIndex].className = "char correct";
            } else {
              incorrectKeystrokes++;
              charElements[charIndex].className = "char incorrect";
            }

            charIndex++;

            // Set current marker on next char
            if (charIndex < currentText.length) {
              charElements[charIndex].className = "char current";
            }

            updateProgress();
            updateStats();

            // Passage complete - load next
            if (charIndex >= currentText.length) {
              loadNextPassage();
            }
          }

          // Keep input in sync (prevent it from getting too long or out of sync)
          if (inputVal.length > charIndex) {
            hiddenInput.value = inputVal.substring(0, charIndex);
          }
        }

        function updateProgress() {
          const pct = currentText.length > 0 ? (charIndex / currentText.length) * 100 : 0;
          progressBar.style.width = pct + "%";
        }

        // ── Prevent paste ──
        hiddenInput.addEventListener("paste", function (e) {
          e.preventDefault();
        });

        hiddenInput.addEventListener("drop", function (e) {
          e.preventDefault();
        });

        // ── Input event ──
        hiddenInput.addEventListener("input", handleInput);

        // ── Click on passage refocuses input ──
        passageWrapper.addEventListener("click", focusInput);
        document.addEventListener("click", function (e) {
          if (!resultsOverlay.classList.contains("active")) {
            focusInput();
          }
        });

        // ── Duration selector ──
        modeSelector.addEventListener("click", function (e) {
          const btn = e.target.closest("[data-duration]");
          if (!btn) return;

          // Don't allow switching during active test
          if (started && !finished) return;

          modeSelector.querySelectorAll(".btn").forEach(function (b) {
            b.classList.remove("active");
          });
          btn.classList.add("active");

          duration = parseInt(btn.dataset.duration, 10);
          resetTest();
        });

        // ── Try again ──
        tryAgainBtn.addEventListener("click", function () {
          resetTest();
        });

        // ── Keyboard shortcut: Escape to restart during test ──
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && resultsOverlay.classList.contains("active")) {
            resetTest();
          }
          // Tab should not leave the input
          if (e.key === "Tab" && !resultsOverlay.classList.contains("active")) {
            e.preventDefault();
            focusInput();
          }
        });

        // ── Init ──
        renderPassage(pickPassage());
        timeDisplay.textContent = duration;
        focusInput();
      })();
    </script>
  </body>
</html>
