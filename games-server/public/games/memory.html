<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Match — Games Portal</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      /* ── Card Grid ── */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        max-width: 520px;
        margin: 0 auto;
      }

      /* ── Card Container (perspective wrapper) ── */
      .card {
        aspect-ratio: 1;
        perspective: 800px;
        cursor: pointer;
      }

      .card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transition: transform 0.5s var(--ease-out);
        transform-style: preserve-3d;
      }

      .card.flipped .card-inner {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--border);
        transition:
          border-color 0.3s var(--ease-out),
          box-shadow 0.3s var(--ease-out);
      }

      /* ── Card Back ── */
      .card-back {
        background:
          radial-gradient(circle at 30% 30%, rgba(124, 92, 252, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 70% 70%, rgba(232, 121, 249, 0.1) 0%, transparent 50%),
          var(--bg-card);
        z-index: 2;
      }

      .card-back::after {
        content: "?";
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent);
        opacity: 0.4;
      }

      /* ── Card Front ── */
      .card-front {
        background: var(--bg-card);
        transform: rotateY(180deg);
        font-size: 2.8rem;
        line-height: 1;
      }

      /* ── Card States ── */
      .card:hover:not(.flipped):not(.matched) .card-back {
        border-color: var(--accent);
        box-shadow: var(--shadow-glow);
      }

      .card.matched .card-face {
        border-color: var(--success);
        box-shadow: 0 0 20px rgba(52, 211, 153, 0.25);
      }

      .card.matched .card-front {
        background: linear-gradient(135deg, rgba(52, 211, 153, 0.08), var(--bg-card));
      }

      .card.matched {
        cursor: default;
      }

      .card.flipped:not(.matched) {
        cursor: default;
      }

      /* ── Match pop animation ── */
      @keyframes matchPop {
        0% {
          transform: rotateY(180deg) scale(1);
        }
        50% {
          transform: rotateY(180deg) scale(1.1);
        }
        100% {
          transform: rotateY(180deg) scale(1);
        }
      }

      .card.matched .card-inner {
        animation: matchPop 0.4s var(--ease-bounce);
        transform: rotateY(180deg);
      }

      /* ── Controls Row ── */
      .controls {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      /* ── Mode Selector ── */
      .mode-selector {
        margin-bottom: 1rem;
      }

      /* ── Win Modal Extras ── */
      .modal .stats {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-bottom: 1.5rem;
      }

      .modal .stat {
        text-align: center;
      }

      .modal .stat .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent-light);
        display: block;
      }

      .modal .stat .stat-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .modal .trophy {
        font-size: 3.5rem;
        margin-bottom: 0.75rem;
        display: block;
      }

      /* ── Responsive ── */
      @media (max-width: 640px) {
        .card-grid {
          gap: 0.6rem;
          max-width: 360px;
        }

        .card-front {
          font-size: 2rem;
        }

        .card-back::after {
          font-size: 1.5rem;
        }
      }

      @media (max-width: 380px) {
        .card-grid {
          gap: 0.5rem;
          max-width: 300px;
        }

        .card-front {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- ── Header ── -->
    <header class="game-header">
      <a href="/" class="back-link">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 18l-6-6 6-6" />
        </svg>
        Games
      </a>
      <h1>Memory Match</h1>
    </header>

    <!-- ── Main ── -->
    <main class="game-container">
      <!-- Difficulty selector -->
      <div class="mode-selector" id="modeSelector">
        <button class="btn btn-secondary active" data-size="4">4 &times; 4</button>
        <button class="btn btn-secondary" data-size="5">5 &times; 4</button>
        <button class="btn btn-secondary" data-size="6">6 &times; 4</button>
      </div>

      <!-- Score bar -->
      <div class="score-bar">
        <div class="score-item">
          <div class="label">Moves</div>
          <div class="value" id="moves">0</div>
        </div>
        <div class="score-item">
          <div class="label">Matches</div>
          <div class="value" id="matches">0 / 8</div>
        </div>
        <div class="score-item">
          <div class="label">Time</div>
          <div class="value" id="timer">0:00</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="btn btn-secondary" id="resetBtn">New Game</button>
      </div>

      <!-- Card grid -->
      <div class="card-grid" id="grid"></div>
    </main>

    <!-- ── Win Overlay ── -->
    <div class="overlay" id="winOverlay">
      <div class="modal">
        <span class="trophy">🏆</span>
        <h2>You Win!</h2>
        <p>All pairs matched. Great memory!</p>
        <div class="stats">
          <div class="stat">
            <span class="stat-value" id="finalMoves">0</span>
            <span class="stat-label">Moves</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="finalTime">0:00</span>
            <span class="stat-label">Time</span>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" id="playAgainBtn">Play Again</button>
      </div>
    </div>

    <!-- ── Game Logic ── -->
    <script>
      (() => {
        "use strict";

        // ── Emoji pool (enough for the largest grid: 6x4 = 24 cards = 12 pairs) ──
        const EMOJI_POOL = ["🎮", "🎲", "🎯", "🏆", "🚀", "🌟", "🎪", "🎭", "🎸", "🎨", "🐉", "💎"];

        // ── DOM refs ──
        const gridEl = document.getElementById("grid");
        const movesEl = document.getElementById("moves");
        const matchesEl = document.getElementById("matches");
        const timerEl = document.getElementById("timer");
        const resetBtn = document.getElementById("resetBtn");
        const winOverlay = document.getElementById("winOverlay");
        const finalMovesEl = document.getElementById("finalMoves");
        const finalTimeEl = document.getElementById("finalTime");
        const playAgainBtn = document.getElementById("playAgainBtn");
        const modeSelector = document.getElementById("modeSelector");

        // ── State ──
        let cards = [];
        let flippedCards = [];
        let matchedCount = 0;
        let totalPairs = 8;
        let moveCount = 0;
        let timerInterval = null;
        let elapsedSeconds = 0;
        let gameStarted = false;
        let lockBoard = false;
        let columns = 4;

        // ── Shuffle (Fisher-Yates) ──
        function shuffle(arr) {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        // ── Format time ──
        function formatTime(s) {
          const min = Math.floor(s / 60);
          const sec = s % 60;
          return `${min}:${sec.toString().padStart(2, "0")}`;
        }

        // ── Timer ──
        function startTimer() {
          if (gameStarted) return;
          gameStarted = true;
          timerInterval = setInterval(() => {
            elapsedSeconds++;
            timerEl.textContent = formatTime(elapsedSeconds);
          }, 1000);
        }

        function stopTimer() {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        // ── Update display ──
        function updateDisplay() {
          movesEl.textContent = moveCount;
          matchesEl.textContent = `${matchedCount} / ${totalPairs}`;
        }

        // ── Create a card element ──
        function createCardEl(emoji, index) {
          const card = document.createElement("div");
          card.className = "card";
          card.dataset.index = index;
          card.dataset.emoji = emoji;

          card.innerHTML = `
          <div class="card-inner">
            <div class="card-face card-back"></div>
            <div class="card-face card-front">${emoji}</div>
          </div>
        `;

          card.addEventListener("click", () => onCardClick(card));
          return card;
        }

        // ── Card click handler ──
        function onCardClick(card) {
          // Guards
          if (lockBoard) return;
          if (card.classList.contains("flipped")) return;
          if (card.classList.contains("matched")) return;

          // Start timer on first click
          startTimer();

          // Flip card
          card.classList.add("flipped");
          flippedCards.push(card);

          // Check for pair
          if (flippedCards.length === 2) {
            moveCount++;
            updateDisplay();
            lockBoard = true;

            const [a, b] = flippedCards;

            if (a.dataset.emoji === b.dataset.emoji) {
              // Match found
              setTimeout(() => {
                a.classList.add("matched");
                b.classList.add("matched");
                matchedCount++;
                updateDisplay();
                flippedCards = [];
                lockBoard = false;

                // Win check
                if (matchedCount === totalPairs) {
                  stopTimer();
                  showWinScreen();
                }
              }, 300);
            } else {
              // No match — flip back
              setTimeout(() => {
                a.classList.remove("flipped");
                b.classList.remove("flipped");
                flippedCards = [];
                lockBoard = false;
              }, 1000);
            }
          }
        }

        // ── Win screen ──
        function showWinScreen() {
          finalMovesEl.textContent = moveCount;
          finalTimeEl.textContent = formatTime(elapsedSeconds);
          // Small delay so the last match animation plays
          setTimeout(() => {
            winOverlay.classList.add("active");
          }, 600);
        }

        // ── Init / Reset ──
        function initGame() {
          // Reset state
          stopTimer();
          cards = [];
          flippedCards = [];
          matchedCount = 0;
          moveCount = 0;
          elapsedSeconds = 0;
          gameStarted = false;
          lockBoard = false;
          winOverlay.classList.remove("active");

          // Pick emojis for this grid size
          const emojis = EMOJI_POOL.slice(0, totalPairs);
          const deck = shuffle([...emojis, ...emojis]);

          // Update grid columns
          gridEl.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;

          // Build grid
          gridEl.innerHTML = "";
          deck.forEach((emoji, i) => {
            const cardEl = createCardEl(emoji, i);
            gridEl.appendChild(cardEl);
          });

          // Update display
          timerEl.textContent = "0:00";
          updateDisplay();
        }

        // ── Difficulty buttons ──
        modeSelector.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-size]");
          if (!btn) return;

          // Update active state
          modeSelector.querySelectorAll(".btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");

          const size = parseInt(btn.dataset.size, 10);
          columns = size;
          // Rows always 4 => pairs = (size * 4) / 2
          totalPairs = (size * 4) / 2;
          initGame();
        });

        // ── Buttons ──
        resetBtn.addEventListener("click", initGame);
        playAgainBtn.addEventListener("click", initGame);

        // ── Start ──
        initGame();
      })();
    </script>
  </body>
</html>
