<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --phosphor: #39ff85;
        --phosphor-dim: #1a7a3e;
        --phosphor-glow: rgba(57, 255, 133, 0.25);
        --bg: #030a05;
        --scanline-h: 3px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Noise texture via SVG */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 200px 200px;
        pointer-events: none;
        z-index: 100;
        opacity: 0.5;
      }

      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* CRT Vignette */
      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
        pointer-events: none;
        z-index: 10;
      }

      /* Scanlines */
      .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          transparent,
          transparent calc(var(--scanline-h) - 1px),
          rgba(0, 0, 0, 0.18) var(--scanline-h)
        );
        pointer-events: none;
        z-index: 5;
        animation: scanroll 8s linear infinite;
      }

      @keyframes scanroll {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 0 100vh;
        }
      }

      /* Horizontal scan sweep */
      .sweep {
        position: absolute;
        top: -10%;
        left: 0;
        width: 100%;
        height: 12%;
        background: linear-gradient(to bottom, transparent, rgba(57, 255, 133, 0.035), transparent);
        pointer-events: none;
        z-index: 6;
        animation: sweepdown 6s ease-in-out infinite;
      }

      @keyframes sweepdown {
        0% {
          top: -12%;
        }
        100% {
          top: 110%;
        }
      }

      /* Main content */
      .content {
        position: relative;
        z-index: 20;
        text-align: center;
        opacity: 0;
        animation:
          bootup 0.15s steps(1) 0.4s forwards,
          flicker 0.08s steps(1) 0.55s 3,
          settle 0.4s ease-out 0.75s both;
      }

      @keyframes bootup {
        to {
          opacity: 1;
        }
      }

      @keyframes flicker {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @keyframes settle {
        from {
          opacity: 0;
          transform: scale(1.01) translateY(-4px);
          filter: blur(2px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0);
        }
      }

      .label {
        font-family: "Share Tech Mono", monospace;
        font-size: clamp(0.6rem, 1.2vw, 0.85rem);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--phosphor-dim);
        margin-bottom: 1.5rem;
        display: block;
      }

      h1 {
        font-family: "VT323", monospace;
        font-size: clamp(5rem, 18vw, 18rem);
        line-height: 0.88;
        color: var(--phosphor);
        text-shadow:
          0 0 10px var(--phosphor),
          0 0 30px var(--phosphor-glow),
          0 0 80px rgba(57, 255, 133, 0.15);
        letter-spacing: -0.02em;
        user-select: none;
        position: relative;
      }

      /* Glitch effect on hover */
      h1:hover {
        animation: glitch 0.4s steps(2) infinite;
      }

      @keyframes glitch {
        0% {
          text-shadow:
            0 0 10px var(--phosphor),
            0 0 30px var(--phosphor-glow),
            -2px 0 rgba(255, 50, 50, 0.6),
            2px 0 rgba(50, 100, 255, 0.6);
          clip-path: inset(10% 0 80% 0);
          transform: translateX(-2px);
        }
        25% {
          text-shadow:
            0 0 10px var(--phosphor),
            0 0 30px var(--phosphor-glow),
            2px 0 rgba(255, 50, 50, 0.6),
            -2px 0 rgba(50, 100, 255, 0.6);
          clip-path: inset(60% 0 10% 0);
          transform: translateX(2px);
        }
        50% {
          clip-path: none;
          transform: translateX(0);
          text-shadow:
            0 0 10px var(--phosphor),
            0 0 30px var(--phosphor-glow),
            0 0 80px rgba(57, 255, 133, 0.15);
        }
        75% {
          text-shadow:
            0 0 10px var(--phosphor),
            0 0 30px var(--phosphor-glow),
            -3px 0 rgba(255, 50, 50, 0.5);
          clip-path: inset(30% 0 50% 0);
          transform: translateX(-1px);
        }
        100% {
          clip-path: none;
          transform: translateX(0);
          text-shadow:
            0 0 10px var(--phosphor),
            0 0 30px var(--phosphor-glow),
            0 0 80px rgba(57, 255, 133, 0.15);
        }
      }

      .cursor {
        display: inline-block;
        width: 0.55em;
        height: 0.8em;
        background: var(--phosphor);
        margin-left: 0.06em;
        vertical-align: middle;
        position: relative;
        top: -0.06em;
        box-shadow:
          0 0 10px var(--phosphor),
          0 0 24px var(--phosphor-glow);
        animation: blink 1.1s step-end infinite;
      }

      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      .footer {
        font-family: "Share Tech Mono", monospace;
        font-size: clamp(0.55rem, 1vw, 0.72rem);
        color: var(--phosphor-dim);
        letter-spacing: 0.2em;
        margin-top: 3rem;
        opacity: 0;
        animation: fadein 0.6s ease-out 1.4s forwards;
      }

      @keyframes fadein {
        to {
          opacity: 0.55;
        }
      }

      .footer span {
        display: inline-block;
        margin: 0 1.2em;
      }

      /* Corner brackets */
      .corner {
        position: absolute;
        width: 60px;
        height: 60px;
        z-index: 20;
        opacity: 0;
        animation: fadein 0.5s ease-out 1.2s forwards;
      }
      .corner::before,
      .corner::after {
        content: "";
        position: absolute;
        background: var(--phosphor);
        opacity: 0.3;
      }
      .corner::before {
        width: 2px;
        height: 100%;
      }
      .corner::after {
        width: 100%;
        height: 2px;
      }

      .corner-tl {
        top: 24px;
        left: 24px;
      }
      .corner-tr {
        top: 24px;
        right: 24px;
        transform: scaleX(-1);
      }
      .corner-bl {
        bottom: 24px;
        left: 24px;
        transform: scaleY(-1);
      }
      .corner-br {
        bottom: 24px;
        right: 24px;
        transform: scale(-1);
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="scanlines"></div>
      <div class="sweep"></div>

      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <div class="content">
        <span class="label">SYS://OUTPUT &nbsp;—&nbsp; TERMINAL v1.0.0</span>
        <h1>Hello World<span class="cursor"></span></h1>
        <p class="footer">
          <span>0x48454C4C4F</span>
          <span>READY</span>
          <span>1970-01-01 00:00:00</span>
        </p>
      </div>
    </div>
  </body>
</html>
