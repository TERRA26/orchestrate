<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Pinball</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="hud">
        <div id="score-display">
          <span class="hud-label">SCORE</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div id="title-display">
          <span class="game-title">NEON PINBALL</span>
        </div>
        <div id="ball-display">
          <span class="hud-label">BALLS</span>
          <span id="balls" class="hud-value">3</span>
        </div>
      </div>
      <canvas id="pinball-canvas"></canvas>
      <div id="game-over-overlay" class="hidden">
        <div id="game-over-box">
          <h1>GAME OVER</h1>
          <p>FINAL SCORE</p>
          <p id="final-score" class="final-score-value">0</p>
          <p id="high-score-text" class="high-score-text" style="display: none"></p>
          <button id="restart-btn">RESTART</button>
        </div>
      </div>
      <div id="controls-bar">
        <button id="launch-btn">⬆ LAUNCH</button>
      </div>
      <div id="controls-hint">
        <span>A / ← Left Flipper</span>
        <span>SPACE Launch</span>
        <span>D / → Right Flipper</span>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
