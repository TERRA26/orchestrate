<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>"
    />
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
      <div class="nav-inner">
        <div class="nav-logo" id="nav-logo">Instagram</div>
        <div class="nav-search">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <line
              x1="16.5"
              y1="16.5"
              x2="21"
              y2="21"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <input type="text" placeholder="Search" id="search-input" />
        </div>
        <div class="nav-icons">
          <button class="nav-icon-btn" data-page="feed" title="Home" id="nav-home">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path d="M12 2L2 12h3v9h5v-5.5a2 2 0 0 1 4 0V21h5v-9h3L12 2z" fill="currentColor" />
            </svg>
          </button>
          <button class="nav-icon-btn" data-page="explore" title="Explore" id="nav-explore">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path
                d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <line
                x1="16.511"
                y1="16.511"
                x2="22"
                y2="22"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button class="nav-icon-btn" title="Reels">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <rect
                x="2"
                y="2"
                width="20"
                height="20"
                rx="4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <line x1="2" y1="8" x2="22" y2="8" stroke="currentColor" stroke-width="2" />
              <polygon points="10,12 16,15 10,18" fill="currentColor" />
            </svg>
          </button>
          <button class="nav-icon-btn" title="Messages">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path
                d="M20.5 3.5L3.5 10.5l6 3 8-6-6 8 3 6z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="nav-icon-btn" title="Notifications" id="nav-notifications">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path
                d="M16.792 3.904A4.989 4.989 0 0 1 21.5 9.122c0 3.072-2.652 4.959-5.197 7.222-2.512 2.243-3.865 3.469-4.303 3.752-.477-.309-1.816-1.51-4.303-3.752C5.152 14.08 2.5 12.194 2.5 9.122a4.989 4.989 0 0 1 4.708-5.218 4.21 4.21 0 0 1 3.675 1.941c.84 1.175.98 1.763 1.12 1.763s.278-.588 1.11-1.766a4.17 4.17 0 0 1 3.679-1.938z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
            <span class="notification-badge">3</span>
          </button>
          <button class="nav-icon-btn" title="Create" id="nav-create">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />
              <line
                x1="12"
                y1="8"
                x2="12"
                y2="16"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <line
                x1="8"
                y1="12"
                x2="16"
                y2="12"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button class="nav-icon-btn" data-page="profile" title="Profile" id="nav-profile">
            <img src="https://i.pravatar.cc/150?img=11" alt="Profile" class="nav-avatar" />
          </button>
          <button
            class="nav-icon-btn dark-mode-toggle"
            title="Toggle dark mode"
            id="dark-mode-toggle"
          >
            <svg viewBox="0 0 24 24" width="24" height="24" class="moon-icon">
              <path
                d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg viewBox="0 0 24 24" width="24" height="24" class="sun-icon" style="display: none">
              <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2" />
              <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
              </g>
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- Notification Dropdown -->
    <div class="notification-dropdown" id="notification-dropdown">
      <div class="notif-header">Notifications</div>
      <div class="notif-list" id="notif-list"></div>
    </div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- FEED PAGE -->
      <div class="page page-feed active" id="page-feed">
        <div class="feed-layout">
          <div class="feed-center">
            <!-- Stories Bar -->
            <div class="stories-bar" id="stories-bar"></div>
            <!-- Feed Posts -->
            <div class="feed-posts" id="feed-posts"></div>
          </div>
          <!-- Right Sidebar -->
          <aside class="sidebar" id="sidebar"></aside>
        </div>
      </div>

      <!-- EXPLORE PAGE -->
      <div class="page page-explore" id="page-explore">
        <div class="explore-grid" id="explore-grid"></div>
      </div>

      <!-- PROFILE PAGE -->
      <div class="page page-profile" id="page-profile">
        <div class="profile-container" id="profile-container"></div>
      </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="bottom-nav-btn active" data-page="feed">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M12 2L2 12h3v9h5v-5.5a2 2 0 0 1 4 0V21h5v-9h3L12 2z" fill="currentColor" />
        </svg>
      </button>
      <button class="bottom-nav-btn" data-page="explore">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path
            d="M19 10.5A8.5 8.5 0 1 1 10.5 2a8.5 8.5 0 0 1 8.5 8.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <line
            x1="16.511"
            y1="16.511"
            x2="22"
            y2="22"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <button class="bottom-nav-btn" id="mobile-create">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <line
            x1="12"
            y1="8"
            x2="12"
            y2="16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
          <line
            x1="8"
            y1="12"
            x2="16"
            y2="12"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <button class="bottom-nav-btn" data-page="profile">
        <img src="https://i.pravatar.cc/150?img=11" alt="Profile" class="nav-avatar" />
      </button>
    </nav>

    <!-- Story Viewer Overlay -->
    <div class="story-viewer" id="story-viewer">
      <div class="story-progress-bar" id="story-progress-bar"></div>
      <div class="story-header">
        <img class="story-viewer-avatar" id="story-viewer-avatar" src="" alt="" />
        <span class="story-viewer-username" id="story-viewer-username"></span>
        <span class="story-viewer-time">2h</span>
        <button class="story-close" id="story-close">&times;</button>
      </div>
      <div class="story-image-container">
        <img class="story-viewer-image" id="story-viewer-image" src="" alt="Story" />
      </div>
      <button class="story-nav story-prev" id="story-prev">&#8249;</button>
      <button class="story-nav story-next" id="story-next">&#8250;</button>
    </div>

    <!-- Create Post Modal -->
    <div class="modal-overlay" id="create-modal">
      <div class="create-modal-content">
        <div class="create-modal-header">
          <button class="modal-cancel" id="modal-cancel">Cancel</button>
          <h3>Create new post</h3>
          <button class="modal-share" id="modal-share">Share</button>
        </div>
        <div class="create-modal-body">
          <div class="upload-area" id="upload-area">
            <svg viewBox="0 0 24 24" width="48" height="48">
              <path
                d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" />
              <polyline
                points="21,15 16,10 5,21"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
            </svg>
            <p>Drag photos and videos here</p>
            <button class="upload-btn">Select from computer</button>
            <img class="upload-preview" id="upload-preview" src="" alt="" style="display: none" />
          </div>
          <div class="caption-area">
            <div class="caption-user">
              <img src="https://i.pravatar.cc/150?img=11" alt="" />
              <span>you</span>
            </div>
            <textarea
              placeholder="Write a caption..."
              id="caption-input"
              maxlength="2200"
            ></textarea>
            <div class="caption-count"><span id="caption-count">0</span>/2,200</div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
