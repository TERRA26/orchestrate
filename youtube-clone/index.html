<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Clone</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ===== TOP NAV BAR ===== -->
    <header class="topnav" id="topnav">
      <div class="topnav__start">
        <button class="topnav__menu-btn icon-btn" id="menuToggle" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>
        <a href="#" class="topnav__logo" id="logoLink">
          <svg viewBox="0 0 90 20" width="90" height="20" class="topnav__logo-icon">
            <rect x="0" y="2" width="28" height="16" rx="4" fill="#FF0000" />
            <polygon points="11,6 11,14 19,10" fill="#fff" />
            <text
              x="32"
              y="15.5"
              fill="currentColor"
              font-family="Roboto,sans-serif"
              font-size="14"
              font-weight="700"
              letter-spacing="-0.5"
            >
              YouTube
            </text>
          </svg>
        </a>
      </div>

      <div class="topnav__center">
        <form class="search-bar" id="searchForm">
          <input
            type="text"
            class="search-bar__input"
            id="searchInput"
            placeholder="Search"
            aria-label="Search"
          />
          <button type="submit" class="search-bar__btn" aria-label="Search">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path
                fill="currentColor"
                d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
              />
            </svg>
          </button>
        </form>
      </div>

      <div class="topnav__end">
        <button class="icon-btn" id="darkModeToggle" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="24" height="24" class="icon-light">
            <path
              fill="currentColor"
              d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"
            />
          </svg>
          <svg viewBox="0 0 24 24" width="24" height="24" class="icon-dark" style="display: none">
            <path
              fill="currentColor"
              d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"
            />
          </svg>
        </button>
        <button class="icon-btn" aria-label="Create">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              fill="currentColor"
              d="M14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2zm3-6H3v12h14v-6.39l4 1.83V8.56l-4 1.83V7m1-2v1.67l4-1.83v10.32l-4-1.83V17a1 1 0 01-1 1H3a1 1 0 01-1-1V5a1 1 0 011-1h14a1 1 0 011 1z"
            />
          </svg>
        </button>
        <button class="icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              fill="currentColor"
              d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"
            />
          </svg>
        </button>
        <button class="avatar-btn" id="avatarBtn" aria-label="Account">
          <div class="avatar avatar--nav">Y</div>
        </button>
      </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar__nav">
        <a href="#" class="sidebar__item sidebar__item--active" data-page="home">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
          </svg>
          <span>Home</span>
        </a>
        <a href="#" class="sidebar__item" data-page="trending">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              fill="currentColor"
              d="M17.53 11.2c-.23-.3-.51-.56-.77-.82-.67-.6-1.43-1.03-2.07-1.66C13.33 7.26 13 5.85 13.95 4c-1.73.64-2.58 2.19-2.74 3.5-.13 1.08.08 2.15.73 3.05.12.16.05.42-.15.46-.12.02-.23-.04-.3-.12-.74-.78-.9-1.96-.67-3.01C9.59 8.82 8 10.6 8 12.65c0 .67.12 1.33.37 1.95.19.52.54 1.05.85 1.45.81 1.05 2.13 1.76 3.54 1.9 1.5.14 3.09-.2 4.24-1.22 1.29-1.15 1.74-2.94 1.28-4.6-.12-.44-.37-.88-.75-1.37v.44zm-3.34 4.62c-.34.28-.76.5-1.19.6-.4.1-.88.1-1.28-.02-1.07-.32-1.73-1.27-1.82-2.28-.08-.82.19-1.43.61-2.12.23-.38.49-.73.73-1.12.33.52.58 1.07.71 1.55.24.88.04 1.63-.42 2.27.56-.13.99-.55 1.23-.97.48-.82.5-1.89.16-2.76-.18-.46-.45-.87-.72-1.28-.25-.37-.5-.75-.73-1.14.99.56 1.81 1.44 2.13 2.51.38 1.22.1 2.63-.81 3.46l.4-1.7z"
            />
          </svg>
          <span>Trending</span>
        </a>
        <a href="#" class="sidebar__item" data-page="subscriptions">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              fill="currentColor"
              d="M10 18v-6l5 3-5 3zm7-15H7v2h10V3zm3 4H4v2h16V7zm2 4H2v10h20V11z"
            />
          </svg>
          <span>Subscriptions</span>
        </a>
        <div class="sidebar__divider"></div>
        <a href="#" class="sidebar__item" data-page="library">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              fill="currentColor"
              d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8 12.5v-9l6 4.5-6 4.5z"
            />
          </svg>
          <span>Library</span>
        </a>
        <a href="#" class="sidebar__item" data-page="history">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              fill="currentColor"
              d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"
            />
          </svg>
          <span>History</span>
        </a>
        <div class="sidebar__divider"></div>
        <a href="#" class="sidebar__item" data-page="liked">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              fill="currentColor"
              d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 2 7.59 8.59C7.22 8.95 7 9.45 7 10v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"
            />
          </svg>
          <span>Liked Videos</span>
        </a>
        <a href="#" class="sidebar__item" data-page="watchlater">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path
              fill="currentColor"
              d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"
            />
          </svg>
          <span>Watch Later</span>
        </a>
      </nav>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main" id="main">
      <!-- Home Page -->
      <div class="page page--home" id="homePage">
        <!-- Category Chips -->
        <div class="chips" id="chips">
          <button class="chip chip--active" data-category="all">All</button>
          <button class="chip" data-category="music">Music</button>
          <button class="chip" data-category="gaming">Gaming</button>
          <button class="chip" data-category="news">News</button>
          <button class="chip" data-category="sports">Sports</button>
          <button class="chip" data-category="education">Education</button>
          <button class="chip" data-category="cooking">Cooking</button>
          <button class="chip" data-category="tech">Tech</button>
          <button class="chip" data-category="travel">Travel</button>
          <button class="chip" data-category="comedy">Comedy</button>
        </div>

        <!-- Shorts Shelf -->
        <section class="shorts-shelf" id="shortsShelf">
          <h2 class="shorts-shelf__title">
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              style="vertical-align: middle; margin-right: 8px"
            >
              <path
                fill="#FF0000"
                d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.07 2.04-2 3.49.07 1.42.93 2.67 2.22 3.25.03.01 1.2.5 1.2.5L6 14.93c-1.83.97-2.53 3.24-1.56 5.07.97 1.83 3.24 2.53 5.07 1.56l8.5-4.5c1.29-.68 2.06-2.04 1.99-3.49-.07-1.42-.94-2.68-2.23-3.25z"
              />
            </svg>
            Shorts
          </h2>
          <div class="shorts-shelf__scroll" id="shortsScroll"></div>
        </section>

        <!-- Video Grid -->
        <section class="video-grid" id="videoGrid"></section>
      </div>

      <!-- Watch Page -->
      <div class="page page--watch" id="watchPage" style="display: none">
        <div class="watch-layout">
          <div class="watch-primary">
            <!-- Player -->
            <div class="player" id="player">
              <div class="player__overlay">
                <button class="player__play-btn" aria-label="Play">
                  <svg viewBox="0 0 68 48" width="68" height="48">
                    <path
                      fill="#212121"
                      fill-opacity="0.8"
                      d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.64 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z"
                    />
                    <path fill="#fff" d="M27 34l19-10-19-10z" />
                  </svg>
                </button>
              </div>
            </div>
            <!-- Video Info -->
            <div class="watch-info" id="watchInfo">
              <h1 class="watch-info__title" id="watchTitle"></h1>
              <div class="watch-info__stats">
                <span id="watchViews"></span>
                <span id="watchDate"></span>
              </div>
              <div class="watch-info__actions">
                <button class="action-btn" id="likeBtn">
                  <svg viewBox="0 0 24 24" width="24" height="24">
                    <path
                      fill="currentColor"
                      d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 2 7.59 8.59C7.22 8.95 7 9.45 7 10v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"
                    />
                  </svg>
                  <span id="likeCount"></span>
                </button>
                <button class="action-btn" id="dislikeBtn">
                  <svg viewBox="0 0 24 24" width="24" height="24">
                    <path
                      fill="currentColor"
                      d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 22l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"
                    />
                  </svg>
                  <span>Dislike</span>
                </button>
                <button class="action-btn">
                  <svg viewBox="0 0 24 24" width="24" height="24">
                    <path
                      fill="currentColor"
                      d="M15 5.63L20.66 12 15 18.37V15v-1h-1c-3.96 0-7.14 1-9.75 3.09 1.84-4.07 5.11-6.4 9.89-7.1l.86-.13V9V5.63M14 3v6C6.22 10.13 3.11 15.33 2 21c2.78-3.97 6.44-6 12-6v6l8-9-8-9z"
                    />
                  </svg>
                  <span>Share</span>
                </button>
                <button class="action-btn">
                  <svg viewBox="0 0 24 24" width="24" height="24">
                    <path
                      fill="currentColor"
                      d="M14 10H2v2h12v-2zm0-4H2v2h12V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM2 16h8v-2H2v2z"
                    />
                  </svg>
                  <span>Save</span>
                </button>
              </div>
            </div>
            <!-- Channel Row -->
            <div class="watch-channel" id="watchChannel">
              <div class="watch-channel__left">
                <div class="avatar avatar--channel" id="watchAvatar"></div>
                <div class="watch-channel__info">
                  <span class="watch-channel__name" id="watchChannelName"></span>
                  <span class="watch-channel__subs" id="watchChannelSubs"></span>
                </div>
              </div>
              <button class="subscribe-btn" id="subscribeBtn">Subscribe</button>
            </div>
            <!-- Description -->
            <div class="watch-description" id="watchDescription">
              <div class="watch-description__text" id="watchDescText"></div>
              <button class="watch-description__toggle" id="descToggle">Show more</button>
            </div>
            <!-- Comments -->
            <div class="comments-section" id="commentsSection">
              <h3 class="comments-section__title"><span id="commentCount"></span> Comments</h3>
              <div class="comments-list" id="commentsList"></div>
            </div>
          </div>
          <!-- Sidebar recommendations -->
          <div class="watch-secondary" id="watchSecondary"></div>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
