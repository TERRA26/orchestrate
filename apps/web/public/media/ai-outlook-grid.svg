<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="outlookTitle outlookDesc">
  <title id="outlookTitle">AI future outlook illustration</title>
  <desc id="outlookDesc">Layered panels showing forecasts and trend lines</desc>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="trend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg2)" />
  <g opacity="0.4">
    <circle cx="200" cy="140" r="80" fill="#38bdf8" />
    <circle cx="1040" cy="640" r="120" fill="#f472b6" />
    <circle cx="520" cy="660" r="140" fill="#22d3ee" />
  </g>
  <g transform="translate(140 140)">
    <rect x="0" y="0" width="920" height="520" rx="36" fill="url(#panel)" stroke="#c4b5fd" stroke-opacity="0.3" />
    <rect x="60" y="70" width="800" height="380" rx="28" fill="#0f172a" fill-opacity="0.7" stroke="#94a3b8" stroke-opacity="0.35" />
    <polyline points="100,360 260,300 360,340 520,220 660,260 780,140" fill="none" stroke="url(#trend)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <g fill="#a5b4fc">
      <circle cx="100" cy="360" r="9" />
      <circle cx="260" cy="300" r="9" />
      <circle cx="360" cy="340" r="9" />
      <circle cx="520" cy="220" r="9" />
      <circle cx="660" cy="260" r="9" />
      <circle cx="780" cy="140" r="9" />
    </g>
    <text x="80" y="460" fill="#e0e7ff" font-family="'DM Sans', sans-serif" font-size="22" letter-spacing="0.2em">SCENARIO MAPPER</text>
  </g>
</svg>
